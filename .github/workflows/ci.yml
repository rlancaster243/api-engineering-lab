name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. A branch filter on `main` silently
  # skipped checks for stacked PRs — a PR based on another feature branch got no
  # verification at all, so its code could not be trusted until the parent merged.
  # The `push` filter stays: main-only push builds are what protect trunk.
  pull_request:

env:
  UV_VERSION: "0.11.32"
  UV_PYTHON: "3.12"

jobs:
  test:
    name: lint & pytest — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-rest-api
          - 02-async-job-api
          - 03-api-hardening
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock

      # --locked fails if pyproject.toml and uv.lock disagree, so the installed
      # dependency set is exactly the committed one.
      - name: Install dependencies from lockfile
        run: uv sync --locked --extra dev

      - name: Run Ruff lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest -q

  # PostgreSQL integration tests for Projects 1 and 2. Project 03 has no database
  # tests. The matrix job runs suites without a service DB; these jobs set
  # REQUIRE_DATABASE=1 so skips become failures.
  postgres-01-rest-api:
    name: postgres integration — 01-rest-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-rest-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rest_api_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rest_api_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway credentials for the ephemeral service container.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rest_api_lab
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rest_api_lab
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 01-rest-api/uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --locked --extra dev

      - name: Apply migrations to the empty service database
        run: uv run alembic upgrade head

      - name: Run pytest against PostgreSQL
        run: uv run pytest -q

  postgres-02-async-job-api:
    name: postgres integration — 02-async-job-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-async-job-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: async_job_api_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d async_job_api_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/async_job_api_lab
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/async_job_api_lab
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: 02-async-job-api/uv.lock

      - name: Install dependencies from lockfile
        run: uv sync --locked --extra dev

      - name: Apply migrations to the empty service database
        run: uv run alembic upgrade head

      - name: Run pytest against PostgreSQL
        run: uv run pytest -q
