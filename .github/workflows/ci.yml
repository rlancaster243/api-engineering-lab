name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint & pytest — ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-rest-api
          - 02-async-job-api
          - 03-api-hardening
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff lint & format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        run: pytest -q

      # Postgres service container can be added here when projects include DB tests:
      # services:
      #   postgres:
      #     image: postgres:16
      #     env:
      #       POSTGRES_PASSWORD: postgres
      #     ports:
      #       - 5432:5432
